# Loans
server:
  port: 8090
spring:
  application:
    name: "loans"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3307/loansdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always # always run schema.sql when starting MS
  config:
    import: "optional:configserver:http://localhost:8071/"
  # rabbitmq:
  #   host: "localhost"
  #   port: 5672
  #   username: "guest"
  #   password: "guest"


management:
  endpoints:
    web:
      exposure:
        # enable all management endpoints supported by actuator
        include: "*"