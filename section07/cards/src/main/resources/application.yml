# Cards
server:
  port: 9000
spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always # always run schema.sql when starting MS
  config:
    import: "optional:configserver:http://localhost:8071/" # remove optional if configserver props are crucial
  # rabbitmq:
  #   host: "localhost"
  #   port: 5672
  #   username: "guest"
  #   password: "guest"

management:
  endpoints:
    web:
      exposure:
        # enable all management endpoints supported by actuator
        include: "*"