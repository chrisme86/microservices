# Docker autocomplete for Powershell: docker completion powershell | Out-String | Invoke-Expression
# create and run containers:  docker compose up -d # d= detached mode, terminal can be used while command runs in background
# stop and delete containers:  docker compose down

services:
  rabbit:
    image: rabbitmq:3.12-management
    hostname: rabbitmq
    ports:
      - "5672:5672" # takes care of rabbitMq (MS use this port)
      - "15672:15672" # takes care of core activities
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: cmiethling/configserver:s6
    container_name: configserver-ms
    ports:
      - "8071:8071"
    depends_on: # first rabbit needs to start first
      rabbit:
        condition: service_healthy
    healthcheck: # if readiness is UP then continue, if not then exit all
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      start_period: 10s # do test first time after 10s
      interval: 10s
      timeout: 5s
      retries: 10
    extends:
      file: common-config.yml
      service: microservice-base-config

  # Microservices
  accounts:
    image: cmiethling/accounts:s6
    container_name: accounts-ms
    ports:
      - "8080:8080"
      # - "8081:8080" # SAME accounts at 8080 AND 8081 outside docker (try with Postman)
      # if you want additional accounts at 8081 then make accounts2 at services:
    depends_on: # first (rabbit and) configserver needs to start first
      configserver:
        condition: service_healthy
    environment: # environment Variables >> ALL_PROPS_LIKE_THIS = all.props.like.this
      SPRING_APPLICATION_NAME: "accounts" # workaround for bug in Spring Cloud, it can't find name by itself
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: cmiethling/loans:s6
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: cmiethling/cards:s6
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

# to connect MS' (to connect separate MS use eazybank under networks:)
networks:
  eazybank:
    driver: "bridge" # all MS can communicate with each other