# Docker autocomplete for Powershell: docker completion powershell | Out-String | Invoke-Expression
# create and run containers:  docker compose up -d # d= detached mode, terminal can be used while command runs in background
# stop and delete containers:  docker compose down

services:
  # MySQL DBs
  accountsdb:
    container_name: accountsdb
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: accountsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  loansdb:
    container_name: loansdb
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: loansdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  cardsdb:
    container_name: cardsdb
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: cardsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  configserver:
    image: cmiethling/configserver:s7
    container_name: configserver-ms
    ports:
      - "8071:8071"
    healthcheck: # if readiness is UP then continue, if not then exit all
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      start_period: 10s # do test first time after 10s
      interval: 10s
      timeout: 5s
      retries: 10
    extends:
      file: common-config.yml
      service: microservice-base-config

  # Microservices
  accounts:
    image: cmiethling/accounts:s7
    container_name: accounts-ms
    ports:
      - "8080:8080"
      # - "8081:8080" # SAME accounts at 8080 AND 8081 outside docker (try with Postman)
      # if you want additional accounts at 8081 then make accounts2 at services:
    depends_on: # first (rabbit and) configserver needs to start first
      configserver:
        condition: service_healthy
      accountsdb:
        condition: service_healthy
    environment: # environment Variables >> ALL_PROPS_LIKE_THIS = all.props.like.this
      SPRING_APPLICATION_NAME: "accounts" # workaround for bug in Spring Cloud, it can't find name by itself
      # can also be from external database (then services.accountsdb not needed)
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb" # communication between containers (these services) accountsdb + accounts
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: cmiethling/loans:s7
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
      loansdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
      # not 3307 bc it's started within container network not the external localhost
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: cmiethling/cards:s7
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
      cardsdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
      # not 3308 bc it's started within container network not the external localhost
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

# to connect MS' (to connect separate MS use eazybank under networks:)
networks:
  eazybank:
    driver: "bridge" # all MS can communicate with each other