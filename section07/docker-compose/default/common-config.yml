services:
  # for all services
  network-deploy-service:
    networks:
      - eazybank

  microservice-db-config:
    extends:
      service: network-deploy-service
    image: mysql
    healthcheck: # if readiness is UP then continue, if not then exit all
      test: [ "CMD","mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    environment:
      MYSQL_ROOT_PASSWORD: root

  # for all services except rabbit (if used)
  microservice-base-config:
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 700m
    environment:
      SPRING_RABBITMQ_HOST: "rabbit" # spring.rabbitmq.host= "localhost" >> localhost has to be name of (docker) service

  # for core services: accounts, cards and loans
  microservice-configserver-config:
    extends:
      service: microservice-base-config
    environment:
      # MS must be connected to configserver MS(!) >> spring.config.import from application.yml with localhost=MS name of configserver (=configserver)
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default
      # for MySQL
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    # depends_on: # not possible with extends within one service (recent docker compose versions)
    #   configserver:
    #     condition: service_healthy

